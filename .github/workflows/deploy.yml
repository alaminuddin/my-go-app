name: Go CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-app-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test application
        run: go test ./...

      - name: Build application
        run: go build -o my-go-app .

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest

      - name: Deploy to Ubuntu VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ""
          envs: IMAGE
          script: |
            set -eu

            # 1. Install Docker & Compose if missing
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Setting up Docker repository for Ubuntu..."

              # Remove broken old docker repository files if any exist
              sudo rm -f /etc/apt/sources.list.d/docker.list /etc/apt/sources.list.d/docker.sources

              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg

              # Setup official GPG key
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg

              # Add repository using deb822 format (compatible with Ubuntu 24.04 Noble)
              CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
              echo "Types: deb
              URIs: https://download.docker.com/linux/ubuntu
              Suites: ${CODENAME}
              Components: stable
              Signed-By: /etc/apt/keyrings/docker.gpg" | sudo tee /etc/apt/sources.list.d/docker.sources > /dev/null

              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

              sudo usermod -aG docker "$USER"
              sudo ln -sf $(which docker) /usr/bin/docker
            fi
            # 2. Ensure application directory exists
            mkdir -p "$HOME/go-app"
            cd "$HOME/go-app"

            # 3. Deploy container
            export IMAGE_NAME="${IMAGE%:*}"
            export IMAGE_TAG="${IMAGE##*:}"

            docker compose pull app
            docker compose up -d app

            docker compose ps
